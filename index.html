<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ii-V-I">
    <title>ii-V-I Trainer</title>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f1ead9;
            --paper-dark: #e8dfca;
            --ink: #171512;
            --ink-light: #3a3226;
            --ink-muted: #6e6656;
            --amber: #c4531c;
            --amber-light: #d68a5c;
            --red: #8b2020;
            --green: #3c6b4a;
            --blue: #1a3060;
            --border: #b3a68e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
        }

        .container {
            max-width: 620px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
            background:
                radial-gradient(ellipse at 80% 15%, rgba(26,48,96,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 85%, rgba(26,92,42,0.05) 0%, transparent 50%),
                var(--paper);
            min-height: 100vh;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid var(--ink);
        }

        h1 {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--ink);
            letter-spacing: 0.005em;
            text-transform: uppercase;
            line-height: 0.95;
        }

        .header-sub {
            font-style: italic;
            font-size: 0.9rem;
            color: var(--ink-muted);
            margin-top: 0.4rem;
            letter-spacing: 0.05em;
        }

        /* Key display */
        .key-display {
            text-align: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--paper-dark);
            border: 1px solid var(--border);
            border-radius: 0;
        }

        .key-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--amber);
            margin-bottom: 0.3rem;
        }

        .key-name {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--amber);
            line-height: 1;
        }

        /* Chart — the main ii-V-I display */
        .chart {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
            gap: 0;
            border: 2px solid var(--ink);
            border-radius: 0;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .chord-cell {
            padding: 1.2rem 1rem;
            border-right: 1px solid var(--border);
            background: var(--paper);
            transition: background 0.15s;
            position: relative;
        }

        .chord-cell:last-child { border-right: none; }

        .chord-cell.active {
            background: var(--paper-dark);
        }

        .chord-cell.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
        }

        .chord-cell:nth-child(1).active::after { background: var(--red); }
        .chord-cell:nth-child(2).active::after { background: var(--blue); }
        .chord-cell:nth-child(3).active::after { background: var(--green); }

        .cell-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--ink-muted);
            margin-bottom: 0.5rem;
        }

        .chord-name {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 0.4rem;
        }

        .chord-cell:nth-child(1) .chord-name { color: var(--red); }
        .chord-cell:nth-child(2) .chord-name { color: var(--blue); }
        .chord-cell:nth-child(3) .chord-name { color: var(--green); }

        .chord-tones {
            font-size: 0.7rem;
            color: var(--ink-muted);
            font-style: italic;
            line-height: 1.4;
        }

        .bars-label {
            font-size: 0.62rem;
            color: var(--ink-muted);
            margin-top: 0.4rem;
            letter-spacing: 0.05em;
        }

        /* Progress / beat indicator */
        .beat-row {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
            gap: 0;
            margin-bottom: 1.5rem;
        }

        .beat-section {
            display: flex;
            gap: 4px;
            padding: 0 0.5rem;
            justify-content: center;
        }

        .beat-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: transparent;
            transition: all 0.08s;
        }

        .beat-dot.active-ii { background: var(--red); border-color: var(--red); }
        .beat-dot.active-v  { background: var(--blue); border-color: var(--blue); }
        .beat-dot.active-i  { background: var(--green); border-color: var(--green); }

        /* Next chord preview */
        .next-preview {
            text-align: center;
            padding: 0.75rem 1rem;
            background: var(--paper-dark);
            border: 1px solid var(--border);
            border-radius: 0;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
            color: var(--ink-muted);
        }

        .next-preview span {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 1rem;
            color: var(--amber);
            font-weight: 700;
        }

        /* Tempo control */
        .tempo-section {
            background: var(--paper-dark);
            border: 1px solid var(--border);
            border-radius: 0;
            padding: 1rem 1.2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .tempo-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--amber);
            white-space: nowrap;
        }

        .tempo-val {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--ink);
            min-width: 3.5rem;
            text-align: right;
            white-space: nowrap;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 3px;
            background: var(--border);
            border-radius: 0;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--amber);
            cursor: pointer;
            border: 2px solid var(--paper);
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.9rem 1.5rem;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 0;
            transition: all 0.15s;
            letter-spacing: 0.03em;
            border: none;
        }

        .btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .btn-primary {
            background: var(--amber);
            color: var(--paper);
            grid-column: 1 / -1;
            font-family: 'Big Shoulders Display', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--ink);
            color: var(--paper);
        }

        .btn-secondary {
            background: transparent;
            color: var(--ink);
            border: 1.5px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            border-color: var(--ink);
            background: var(--paper-dark);
        }

        /* Status */
        .status {
            text-align: center;
            font-size: 0.75rem;
            color: var(--ink-muted);
            font-style: italic;
            margin-top: 1rem;
        }

        /* Chord selectors */
        .chord-selectors {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0;
            border: 2px solid var(--ink);
            border-radius: 0;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .selector-col {
            border-right: 1px solid var(--border);
            padding: 0.75rem 0.7rem;
        }

        .selector-col:last-child { border-right: none; }

        .selector-label {
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--amber);
            margin-bottom: 0.5rem;
        }

        .chord-type-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.28rem 0.45rem;
            margin-bottom: 0.18rem;
            background: none;
            border: 1px solid transparent;
            border-radius: 0;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.72rem;
            color: var(--ink-light);
            cursor: pointer;
            transition: all 0.12s;
            letter-spacing: 0.01em;
        }

        .chord-type-btn:hover { background: var(--paper-dark); border-color: var(--border); }

        .selector-col:nth-child(1) .chord-type-btn.selected {
            background: rgba(139,32,32,0.08);
            border-color: var(--red);
            color: var(--red);
            font-weight: 700;
        }
        .selector-col:nth-child(2) .chord-type-btn.selected {
            background: rgba(26,48,96,0.08);
            border-color: var(--blue);
            color: var(--blue);
            font-weight: 700;
        }
        .selector-col:nth-child(3) .chord-type-btn.selected {
            background: rgba(26,92,42,0.08);
            border-color: var(--green);
            color: var(--green);
            font-weight: 700;
        }

        /* Divider ornament */
        .ornament {
            text-align: center;
            color: var(--ink-muted);
            font-size: 1rem;
            margin: 0.5rem 0;
            letter-spacing: 0.4em;
        }

        /* Key order row */
        .key-order-section {
            background: var(--paper-dark);
            border: 1px solid var(--border);
            border-radius: 0;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .key-order-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--amber);
            white-space: nowrap;
        }
        .key-order-btns { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .key-order-btn {
            padding: 0.3rem 0.7rem;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.72rem;
            cursor: pointer;
            border-radius: 0;
            border: 1px solid var(--border);
            background: none;
            color: var(--ink-light);
            transition: all 0.12s;
        }
        .key-order-btn:hover { background: var(--paper); border-color: var(--ink); }
        .key-order-btn.selected {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
            font-weight: 700;
        }

        /* Key selector */
        .key-selector-section {
            background: var(--paper-dark);
            border: 2px solid var(--ink);
            border-radius: 0;
            padding: 0.85rem 1rem;
            margin-bottom: 1.5rem;
        }

        .key-selector-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.65rem;
        }

        .key-selector-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--amber);
        }

        .key-selector-presets {
            display: flex;
            gap: 0.4rem;
        }

        .preset-btn {
            font-family: 'Work Sans', sans-serif;
            font-size: 0.62rem;
            padding: 0.18rem 0.5rem;
            border: 1px solid var(--border);
            border-radius: 0;
            background: none;
            color: var(--ink-light);
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: all 0.12s;
        }

        .preset-btn:hover {
            border-color: var(--amber);
            color: var(--amber);
        }

        .key-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
        }

        .key-btn {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.42rem 0.2rem;
            text-align: center;
            border: 1.5px solid var(--border);
            border-radius: 0;
            background: var(--paper);
            color: var(--ink-light);
            cursor: pointer;
            transition: all 0.12s;
        }

        .key-btn:hover {
            border-color: var(--amber);
            color: var(--amber);
        }

        .key-btn.selected {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--paper);
        }

        .key-count {
            font-size: 0.62rem;
            color: var(--ink-muted);
            font-style: italic;
            margin-top: 0.55rem;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ii — V — I</h1>
        </div>

        <div class="chord-selectors">
            <div class="selector-col">
                <div class="selector-label">ii chord</div>
                <button class="chord-type-btn selected" data-slot="ii" data-type="min7">m7</button>
                <button class="chord-type-btn" data-slot="ii" data-type="min7b5">m7♭5</button>
                <button class="chord-type-btn" data-slot="ii" data-type="min9">m9</button>
                <button class="chord-type-btn" data-slot="ii" data-type="min11">m11</button>
            </div>
            <div class="selector-col">
                <div class="selector-label">V chord</div>
                <button class="chord-type-btn selected" data-slot="v" data-type="dom7">7</button>
                <button class="chord-type-btn" data-slot="v" data-type="dom7b9">7♭9</button>
                <button class="chord-type-btn" data-slot="v" data-type="dom7s9">7♯9</button>
                <button class="chord-type-btn" data-slot="v" data-type="dom7s11">7♯11</button>
            </div>
            <div class="selector-col">
                <div class="selector-label">I chord</div>
                <button class="chord-type-btn selected" data-slot="i" data-type="maj7">maj7</button>
                <button class="chord-type-btn" data-slot="i" data-type="maj9">maj9</button>
                <button class="chord-type-btn" data-slot="i" data-type="maj7s11">maj7♯11</button>
                <button class="chord-type-btn" data-slot="i" data-type="min7">m7</button>
                <button class="chord-type-btn" data-slot="i" data-type="minmaj7">m(maj7)</button>
            </div>
        </div>

        <div class="key-order-section">
            <div class="key-order-label">Key Order</div>
            <div class="key-order-btns">
                <button class="key-order-btn selected" data-order="random">Random</button>
                <button class="key-order-btn" data-order="fourths">Circle of 4ths</button>
                <button class="key-order-btn" data-order="fifths">Circle of 5ths</button>
            </div>
        </div>

        <div class="key-selector-section">
            <div class="key-selector-header">
                <span class="key-selector-label">Keys to practice</span>
                <div class="key-selector-presets">
                    <button class="preset-btn" onclick="selectPreset('all')">All 12</button>
                    <button class="preset-btn" onclick="selectPreset('sharps')">Sharps</button>
                    <button class="preset-btn" onclick="selectPreset('flats')">Flats</button>
                    <button class="preset-btn" onclick="selectPreset('naturals')">Naturals</button>
                </div>
            </div>
            <div class="key-grid" id="keyGrid"></div>
            <div class="key-count" id="keyCount">All 12 keys selected</div>
        </div>

        <div class="key-display">
            <div class="key-label">Current Key</div>
            <div class="key-name" id="keyName">—</div>
        </div>

        <div class="chart">
            <div class="chord-cell" id="cell-ii">
                <div class="cell-label" id="label-ii">ii · 1 bar</div>
                <div class="chord-name" id="chord-ii">—</div>
                <div class="chord-tones" id="tones-ii">—</div>
            </div>
            <div class="chord-cell" id="cell-v">
                <div class="cell-label" id="label-v">V · 1 bar</div>
                <div class="chord-name" id="chord-v">—</div>
                <div class="chord-tones" id="tones-v">—</div>
            </div>
            <div class="chord-cell" id="cell-i">
                <div class="cell-label" id="label-i">I · 2 bars</div>
                <div class="chord-name" id="chord-i">—</div>
                <div class="chord-tones" id="tones-i">—</div>
            </div>
        </div>

        <div class="beat-row">
            <div class="beat-section" id="beats-ii">
                <div class="beat-dot" id="b0"></div>
                <div class="beat-dot" id="b1"></div>
                <div class="beat-dot" id="b2"></div>
                <div class="beat-dot" id="b3"></div>
            </div>
            <div class="beat-section" id="beats-v">
                <div class="beat-dot" id="b4"></div>
                <div class="beat-dot" id="b5"></div>
                <div class="beat-dot" id="b6"></div>
                <div class="beat-dot" id="b7"></div>
            </div>
            <div class="beat-section" id="beats-i">
                <div class="beat-dot" id="b8"></div>
                <div class="beat-dot" id="b9"></div>
                <div class="beat-dot" id="b10"></div>
                <div class="beat-dot" id="b11"></div>
                <div class="beat-dot" id="b12"></div>
                <div class="beat-dot" id="b13"></div>
                <div class="beat-dot" id="b14"></div>
                <div class="beat-dot" id="b15"></div>
            </div>
        </div>

        <div class="next-preview" id="nextPreview">
            Press Start to begin
        </div>

        <div class="tempo-section">
            <span class="tempo-label">Tempo</span>
            <input type="range" id="tempoSlider" min="40" max="220" value="100">
            <span class="tempo-val"><span id="tempoVal">100</span> bpm</span>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn">Start</button>
            <button class="btn btn-secondary" id="newKeyBtn" disabled>New Key</button>
            <button class="btn btn-secondary" id="stopBtn" disabled>Stop</button>
        </div>

        <div class="status" id="status">Choose a tempo and press Start</div>

        <div style="margin-top: 1.5rem; padding-top: 0.75rem; border-top: 1px solid var(--border); font-size: 0.62rem; color: var(--ink-muted); text-align: center;">
            Electric piano: Wurlitzer EP200 samples by <a href="http://www.sullivang.net/" target="_blank" rel="noopener" style="color: inherit;">Greg Sullivan</a>, licensed <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener" style="color: inherit;">CC BY 3.0</a>.
        </div>
    </div>

    <script>
        // ── Music theory ──────────────────────────────────────────────────
        const NOTES = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
        const NOTE_FREQ_BASE = {
            'C':130.81,'C#':138.59,'D':146.83,'Eb':155.56,'E':164.81,
            'F':174.61,'F#':185.00,'G':196.00,'Ab':207.65,'A':220.00,
            'Bb':233.08,'B':246.94
        };

        function semitoneUp(note, n) {
            const idx = NOTES.indexOf(note);
            return NOTES[(idx + n) % 12];
        }
        const m2  = (r) => semitoneUp(r, 1);
        const M2  = (r) => semitoneUp(r, 2);
        const m3  = (r) => semitoneUp(r, 3);
        const M3  = (r) => semitoneUp(r, 4);
        const b5  = (r) => semitoneUp(r, 6);
        const P5  = (r) => semitoneUp(r, 7);
        const b7  = (r) => semitoneUp(r, 10);
        const M7  = (r) => semitoneUp(r, 11);
        const s11 = (r) => semitoneUp(r, 6);  // same pitch as b5, enharmonic

        // ── Voicing library ───────────────────────────────────────────────
        // Semitone offsets from root. One octave register.
        const VOICINGS = {
            // ii chords — root position
            min7:    [0,  3,  7, 10],       // root, m3, 5, b7
            min7b5:  [0,  3,  6, 10],       // root, m3, b5, b7
            min9:    [0,  3,  7, 10, 14],   // root, m3, 5, b7, 9
            min11:   [0,  3,  7, 10, 17],   // root, m3, 5, b7, 11
            // V chords — bass root, upper voices 2nd inversion (5, b7, root+12, 3+12)
            dom7:    [0,  7, 10, 12, 16],   // root, 5, b7, root(up), M3(up)
            dom7b9:  [0,  7, 10, 13, 16],   // root, 5, b7, b9, M3(up)
            dom7s9:  [0,  7, 10, 15, 16],   // root, 5, b7, #9, M3(up)
            dom7s11: [0,  7, 10, 16, 18],   // root, 5, b7, M3(up), #11
            // I chords — root position
            maj7:    [0,  4,  7, 11],       // root, M3, 5, M7
            maj9:    [0,  4,  7, 11, 14],   // root, M3, 5, M7, 9
            maj7s11: [0,  4,  6, 11, 18],   // root, M3, #11, M7, #11(up)
            minmaj7: [0,  3,  7, 11],       // root, m3, 5, M7
        };

        // Chord tone display labels — must exactly match VOICINGS
        const TONE_LABELS = {
            min7:    (r) => `${r} · ${m3(r)} · ${P5(r)} · ${b7(r)}`,
            min7b5:  (r) => `${r} · ${m3(r)} · ${b5(r)} · ${b7(r)}`,
            min9:    (r) => `${r} · ${m3(r)} · ${P5(r)} · ${b7(r)} · ${M2(r)}`,
            min11:   (r) => `${r} · ${m3(r)} · ${P5(r)} · ${b7(r)} · ${semitoneUp(r,5)}`,
            dom7:    (r) => `${r} · ${P5(r)} · ${b7(r)} · ${M3(r)}`,

            minmaj7: (r) => `${r} · ${m3(r)} · ${P5(r)} · ${M7(r)}`,

        const TYPE_DISPLAY = {
            min7: 'm7', min7b5: 'm7♭5', min9: 'm9', min11: 'm11',
            dom7: '7', dom7b9: '7♭9', dom7s9: '7♯9', dom7s11: '7♯11',

        function pickRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function buildProgression(key) {
            const iiRoot = semitoneUp(key, 2);
            const vRoot  = semitoneUp(key, 7);
            const iiType = pickRandom(selectedTypes.ii);
            const vType  = pickRandom(selectedTypes.v);
            const iType  = pickRandom(selectedTypes.i);
            return {
                key,
                ii: { root: iiRoot, type: iiType, name: `${iiRoot}${TYPE_DISPLAY[iiType] ?? iiType}` },
                v:  { root: vRoot,  type: vType,  name: `${vRoot}${TYPE_DISPLAY[vType] ?? vType}`   },
                i:  { root: key,    type: iType,  name: `${key}${TYPE_DISPLAY[iType] ?? iType}`     },
            };
        }

            naturals: ['C','D','E','F','G','A','B'],
        };

        function buildKeyGrid() {
            const grid = document.getElementById('keyGrid');
            grid.innerHTML = '';
            NOTES.forEach(note => {
                const btn = document.createElement('button');
                btn.className = 'key-btn selected';
                btn.textContent = note;
                btn.dataset.key = note;
                btn.addEventListener('click', () => toggleKey(note, btn));
                grid.appendChild(btn);
            });
        }

        function toggleKey(note, btn) {
            if (selectedKeys.includes(note)) {
                if (selectedKeys.length === 1) return; // always keep at least one
                selectedKeys = selectedKeys.filter(k => k !== note);
                btn.classList.remove('selected');
            } else {
                selectedKeys = [...selectedKeys, note];
                btn.classList.add('selected');
            }
            updateKeyCount();
            keyOrderIndex = 0;
            if (running) nextProg = buildProgression(nextKey());
        }

        function selectPreset(preset) {
            selectedKeys = [...PRESETS[preset]];
            document.querySelectorAll('.key-btn').forEach(btn => {
                btn.classList.toggle('selected', selectedKeys.includes(btn.dataset.key));
            });
            updateKeyCount();
            keyOrderIndex = 0;
            if (running) nextProg = buildProgression(nextKey());
        }

        let keyOrder = 'random';
        let keyOrderIndex = 0;

        document.querySelectorAll('[data-order]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-order]').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                keyOrder = btn.dataset.order;
                keyOrderIndex = 0;
            });
        });

        function nextKey() {
            if (keyOrder === 'fourths') {
                const seq = CIRCLE_OF_FOURTHS.filter(k => selectedKeys.includes(k));
                const k = seq[keyOrderIndex % seq.length];
                keyOrderIndex++;
                return k;
            } else if (keyOrder === 'fifths') {
                const seq = CIRCLE_OF_FIFTHS.filter(k => selectedKeys.includes(k));
                const k = seq[keyOrderIndex % seq.length];
                keyOrderIndex++;
                return k;
            } else {
                return selectedKeys[Math.floor(Math.random() * selectedKeys.length)];

            const length = ctx.sampleRate * 2.5;
            const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const d = impulse.getChannelData(ch);
                for (let i = 0; i < length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.2);
            }
            convolver.buffer = impulse;
            const wet = ctx.createGain();
            wet.gain.value = 0.28;
            convolver.connect(wet);
            wet.connect(ctx.destination);
            return convolver;
        }

        let pianoReady = false;

        // Decoded up front on an offline context so Start never waits on (or plays before) the samples.
        function preloadPianoSamples() {
            const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
            const decoder = new OAC(1, 1, 44100);
            return Promise.all(PIANO_SAMPLES.map(({ midi, data }) => {
                const binary = atob(data.slice(data.indexOf(',') + 1));
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return new Promise((resolve, reject) => {
                    decoder.decodeAudioData(bytes.buffer, buf => { pianoBuffers[midi] = buf; resolve(); }, reject);
                });
            }));
        }

        const NOTE_MIDI_BASE = {
            'C':48,'C#':49,'D':50,'Eb':51,'E':52,
            'F':53,'F#':54,'G':55,'Ab':56,'A':57,
            'Bb':58,'B':59
        };

        // ── Piano tuning ──────────────────────────────────────────────────
        // The samples are normalized to full scale, so a chord must be mixed down hard or it clips.
        const PIANO_MASTER_GAIN  = 0.22;  // same headroom Changes (Chord Looper) uses
        const PIANO_ATTACK_SEC   = 0.03;  // fade-in; raise for a softer attack
        const PIANO_LOWPASS_HZ   = 3200;  // lower = mellower hammer
        const PIANO_RELEASE_SEC  = 0.08;  // shared release so every note of a chord ends together
        const VOICE_END_FADE_SEC = 0.15;  // each sample is cut off mid-decay, so fade it out first
        const RESTRIKE_EACH_BAR  = true;  // samples only ring ~2s, so re-hit the I chord on its 2nd bar

        let activeChords = [];
        let activeClicks = [];

        function playPianoVoice(ctx, midiNote, startAt, stopAt, dest, sources) {
            let nearest = PIANO_SAMPLES[0];
            for (const s of PIANO_SAMPLES) {
                if (Math.abs(s.midi - midiNote) < Math.abs(nearest.midi - midiNote)) nearest = s;
            }
            const buffer = pianoBuffers[nearest.midi];
            if (!buffer) return;

            const rate = Math.pow(2, (midiNote - nearest.midi) / 12);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.playbackRate.value = rate;

            const endAt = Math.min(stopAt, startAt + buffer.duration / rate);
            const fade = ctx.createGain();
            fade.gain.setValueAtTime(1, startAt);
            fade.gain.setValueAtTime(1, Math.max(startAt, endAt - VOICE_END_FADE_SEC));
            fade.gain.linearRampToValueAtTime(0, endAt);

            source.connect(fade);
            fade.connect(dest);
            source.start(startAt);
            source.stop(endAt + 0.02);
            sources.push(source);
        }

        function playChord(rootNote, voicingType, duration, when) {
            const ctx = getAudio();
            const startAt = when === undefined ? ctx.currentTime : when;
            const endAt = startAt + duration;

            const master = ctx.createGain();
            master.gain.setValueAtTime(0, startAt);
            master.gain.linearRampToValueAtTime(PIANO_MASTER_GAIN, startAt + PIANO_ATTACK_SEC);
            master.gain.setValueAtTime(PIANO_MASTER_GAIN, endAt - PIANO_RELEASE_SEC);
            master.gain.linearRampToValueAtTime(0, endAt);

            const tone = ctx.createBiquadFilter();
            tone.type = 'lowpass';
            tone.frequency.value = PIANO_LOWPASS_HZ;
            tone.Q.value = 0.5;

            master.connect(tone);
            tone.connect(ctx.destination);
            tone.connect(reverbNode);

            const rootMidi = NOTE_MIDI_BASE[rootNote] ?? 48;
            const offsets = VOICINGS[voicingType] || VOICINGS.min7;
            const sources = [];

            offsets.forEach((semitones, i) => {
                const voiceGain = ctx.createGain();
                voiceGain.gain.value = i === 0 ? 0.7 : 0.45;
                const panner = ctx.createStereoPanner();
                panner.pan.value = (i - 2) * 0.12;
                voiceGain.connect(panner);
                panner.connect(master);
                playPianoVoice(ctx, rootMidi + semitones, startAt, endAt + 0.05, voiceGain, sources);
            });

            activeChords = activeChords.filter(c => c.endAt + 0.5 > ctx.currentTime);
            activeChords.push({ master, sources, endAt });
        }

        function stopAllVoices() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            activeChords.forEach(({ master, sources }) => {
                try {
                    master.gain.cancelScheduledValues(now);
                    master.gain.setValueAtTime(master.gain.value, now);
                    master.gain.linearRampToValueAtTime(0, now + 0.04);
                    sources.forEach(src => { try { src.stop(now + 0.06); } catch (e) {} });
                } catch (e) {}
            });
            activeChords = [];
            activeClicks.forEach(src => { try { src.stop(); } catch (e) {} });
            activeClicks = [];
        }

        let clickBuffer = null;

        function playClick(strong, when) {
            const ctx = getAudio();
            if (!clickBuffer) {
                clickBuffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.04), ctx.sampleRate);
                const data = clickBuffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.004));
                }
            }
            const src = ctx.createBufferSource();
            const gain = ctx.createGain();
            gain.gain.value = strong ? 0.18 : 0.08;
            src.buffer = clickBuffer;
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(when === undefined ? ctx.currentTime : when);
            activeClicks.push(src);
            src.onended = () => { activeClicks = activeClicks.filter(c => c !== src); };
        }

        // ── State ─────────────────────────────────────────────────────────
        let running = false;
        let currentProg = null;
        let nextProg = null;
        let beatIndex = 0;
        let beatInterval = null;
        let tempo = 100;

        const BEATS_TOTAL = 16;

        function chordForBeat(b) {
            if (b < 4) return 'ii';
            if (b < 8) return 'v';
            return 'i';
        }

        function shouldPlayChord(b) {
            return b === 0 || b === 4 || b === 8 || (RESTRIKE_EACH_BAR && b === 12);
        }

        // ── UI helpers ────────────────────────────────────────────────────
        function updateCellLabels() {
            const fmt = (slot) => selectedTypes[slot].map(t => TYPE_DISPLAY[t] ?? t).join(' / ');
            document.getElementById('label-ii').textContent = `ii ${fmt('ii')} · 1 bar`;
            document.getElementById('label-v').textContent  = `V ${fmt('v')} · 1 bar`;
            document.getElementById('label-i').textContent  = `I ${fmt('i')} · 2 bars`;
        }

        function updateChart(prog) {
            document.getElementById('keyName').textContent   = prog.key;
            document.getElementById('chord-ii').textContent  = prog.ii.name;
            document.getElementById('chord-v').textContent   = prog.v.name;
            document.getElementById('chord-i').textContent   = prog.i.name;
            document.getElementById('tones-ii').textContent  = TONE_LABELS[prog.ii.type]?.(prog.ii.root) ?? '';
            document.getElementById('tones-v').textContent   = TONE_LABELS[prog.v.type]?.(prog.v.root) ?? '';
            document.getElementById('tones-i').textContent   = TONE_LABELS[prog.i.type]?.(prog.i.root) ?? '';
        }

        function updateBeatDots(beat) {
            for (let i = 0; i < 16; i++) {
                const dot = document.getElementById(`b${i}`);
                dot.className = 'beat-dot';
                if (i === beat) {
                    const chord = chordForBeat(i);
                    dot.classList.add(`active-${chord === 'ii' ? 'ii' : chord === 'v' ? 'v' : 'i'}`);
                }
            }
        }

        function updateCells(beat) {
            ['ii','v','i'].forEach(c => document.getElementById(`cell-${c}`).classList.remove('active'));
            document.getElementById(`cell-${chordForBeat(beat)}`).classList.add('active');
        }

        function updateNextPreview(cur, nxt, beat) {
            const preview = document.getElementById('nextPreview');
            if (beat >= 12) {
                preview.innerHTML = `Next: <span>${nxt.key}</span> — ${nxt.ii.name} · ${nxt.v.name} · ${nxt.i.name}`;
            } else if (beat >= 8) {
                preview.innerHTML = `<span>${cur.i.name}</span> — ${16 - beat} beats remaining`;
            } else if (beat >= 4) {
                preview.innerHTML = `Up next: <span>${cur.i.name}</span> (2 bars)`;
            } else {
                preview.innerHTML = `Up next: <span>${cur.v.name}</span>`;
            }
        }

        // ── Main loop ─────────────────────────────────────────────────────
        // ── Scheduler ─────────────────────────────────────────────────────
        // Beats are scheduled slightly ahead on the audio clock instead of fired from a JS timer,
        // so the first clicks are even and the tempo never drifts.
        const SCHED_LOOKAHEAD_SEC = 0.12;
        const SCHED_TICK_MS = 25;
        let nextBeatTime = 0;
        let uiTimers = [];

        function atAudioTime(when, fn) {
            const delay = Math.max(0, (when - audioCtx.currentTime) * 1000);
            const id = setTimeout(() => {
                uiTimers = uiTimers.filter(t => t !== id);
                fn();
            }, delay);
            uiTimers.push(id);
        }

        function clearUiTimers() {
            uiTimers.forEach(clearTimeout);
            uiTimers = [];
        }

        function scheduleBeat(beat, when) {
            if (beat === 0) {
                if (nextProg) currentProg = nextProg;
                nextProg = buildProgression(nextKey());
            }
            const prog = currentProg;
            const upcoming = nextProg;

            if (shouldPlayChord(beat)) {
                const which = chordForBeat(beat);
                const chord = prog[which];
                const bars = (which === 'i' && !RESTRIKE_EACH_BAR) ? 2 : 1;
                playChord(chord.root, chord.type, (60 / tempo) * 4 * bars * 0.95, when);
            }
            playClick(beat % 4 === 0, when);

            atAudioTime(when, () => {
                if (!running) return;
                if (beat === 0) updateChart(prog);
                updateBeatDots(beat);
                updateCells(beat);
                updateNextPreview(prog, upcoming, beat);
            });
        }

        function scheduler() {
            if (!running) return;
            const now = audioCtx.currentTime;
            if (nextBeatTime < now - 0.1) nextBeatTime = now + 0.05; // tab was throttled: skip ahead, don't burst
            while (nextBeatTime < now + SCHED_LOOKAHEAD_SEC) {
                scheduleBeat(beatIndex, nextBeatTime);
                nextBeatTime += 60 / tempo;
                beatIndex = (beatIndex + 1) % BEATS_TOTAL;
            }
        }

        function start() {
            if (running || !pianoReady) return;
            running = true;
            beatIndex = 0;

            const ctx = getAudio();
            ctx.resume().then(() => {
                if (!running) return;
                nextProg = buildProgression(nextKey());
                nextBeatTime = ctx.currentTime + 0.15;
                beatInterval = setInterval(scheduler, SCHED_TICK_MS);
                scheduler();
            });

            document.getElementById('startBtn').textContent = 'Running…';
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('newKeyBtn').disabled = false;
            document.getElementById('status').textContent = `Playing at ${tempo} bpm`;
        }

        function stop() {
            running = false;
            clearInterval(beatInterval);
            beatInterval = null;
            clearUiTimers();
            stopAllVoices();
            beatIndex = 0;
            keyOrderIndex = 0;

            for (let i = 0; i < 16; i++) document.getElementById(`b${i}`).className = 'beat-dot';
            ['ii','v','i'].forEach(c => document.getElementById(`cell-${c}`).classList.remove('active'));
            document.getElementById('nextPreview').textContent = 'Press Start to begin';
            document.getElementById('startBtn').textContent = 'Start';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('newKeyBtn').disabled = true;
            document.getElementById('status').textContent = 'Stopped';
        }

        function jumpToNewKey() {
            if (!running) return;
            clearUiTimers();
            stopAllVoices();
            beatIndex = 0;
            nextProg = buildProgression(nextKey());
            nextBeatTime = audioCtx.currentTime + 0.08;
        }

        // ── Chord selector buttons ────────────────────────────────────────
        document.querySelectorAll('.chord-type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const slot = btn.dataset.slot;
                const type = btn.dataset.type;
                const current = selectedTypes[slot];

                if (current.includes(type)) {
                    // Deselect — but only if it's not the last one
                    if (current.length > 1) {
                        selectedTypes[slot] = current.filter(t => t !== type);
                        btn.classList.remove('selected');
                    }
                } else {
                    // Select
                    selectedTypes[slot] = [...current, type];
                    btn.classList.add('selected');
                }

                updateCellLabels();
                if (running) nextProg = buildProgression(nextKey());
            });
        });

        // ── Event listeners ───────────────────────────────────────────────
        document.getElementById('startBtn').addEventListener('click', start);
        document.getElementById('stopBtn').addEventListener('click', stop);
        document.getElementById('newKeyBtn').addEventListener('click', jumpToNewKey);

        // iOS audio unlock — play a silent buffer on first touch
        function unlockAudio() {
            const ctx = getAudio();
            const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
            const src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            src.start(0);
            ctx.resume().then(() => {
                document.removeEventListener('touchstart', unlockAudio);
                document.removeEventListener('touchend', unlockAudio);
            });
        }
        document.addEventListener('touchstart', unlockAudio);
        document.addEventListener('touchend', unlockAudio);

        const slider = document.getElementById('tempoSlider');
        slider.addEventListener('input', () => {
            tempo = parseInt(slider.value);
            document.getElementById('tempoVal').textContent = tempo;
            if (running) document.getElementById('status').textContent = `Playing at ${tempo} bpm`;
        });

        // Init
        buildKeyGrid();
        updateCellLabels();

        (function () {
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.textContent = 'Loading piano…';
            const ready = (failed) => {
                pianoReady = true;
                btn.disabled = false;
                btn.textContent = 'Start';
                if (failed) document.getElementById('status').textContent = 'Piano samples failed to load: only the click will sound';
            };
            preloadPianoSamples().then(() => ready(false)).catch(() => ready(true));
        })();

        (function () {
            if (window.parent === window) return;
            function reportHeight() {
                window.parent.postMessage({ type: 'practiceLabToolHeight', height: document.documentElement.scrollHeight }, '*');
            }
            window.addEventListener('load', reportHeight);
            window.addEventListener('resize', reportHeight);
            document.addEventListener('click', () => setTimeout(reportHeight, 60));
            setTimeout(reportHeight, 150);
            setTimeout(reportHeight, 600);
        })();
    </script>
</body>
</html>
